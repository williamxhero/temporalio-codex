[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "temporalio-codex-worker"
version = "0.1.0"
description = "External Temporal Worker for durable Codex delivery"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]
codex = [
    "openai-codex==0.155.1",
]

[project.scripts]
temporalio-codex-run = "temporalio_codex.client:main"
temporalio-codex-worker = "temporalio_codex.worker:main"
temporalio-codex-qualify = "temporalio_codex.qualification:main"
temporalio-codex-delivery = "temporalio_codex.entry:main"
temporalio-codex-live = "temporalio_codex.full_flow_harness:main"
temporalio-codex-retirement = "temporalio_codex.retirement:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: authenticated GitHub acceptance probe, disabled by default"]

[tool.setuptools.packages.find]
where = ["src"]
